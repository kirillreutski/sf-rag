services:

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sfrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sfrag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfrag} -d ${POSTGRES_DB:-sfrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      PG_CONNECTION_STRING: postgresql://${POSTGRES_USER:-sfrag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sfrag}
      GEMINI_EMBEDDING_API_TOKEN: ${GEMINI_EMBEDDING_API_TOKEN}
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_API_TOKEN: ${MCP_API_TOKEN}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
